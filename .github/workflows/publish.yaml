name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v42.0.0)
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag "${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: Checkout tag
        run: |
          git fetch --tags
          git checkout "${{ inputs.tag }}"

      - name: Build CPM.cmake
        run: |
          mkdir dist
          VERSION="${{ inputs.tag }}"
          VERSION="${VERSION#v}"

          sed \
            -e "s/1.0.0-development-version/${VERSION}/g" \
            cmake/CPM.cmake > dist/CPM.cmake

          sed \
            -e "s/1.0.0-development-version/${VERSION}/g" \
            -e "s/CPM_HASH_SUM_PLACEHOLDER/$(sha256sum dist/CPM.cmake | cut -d' ' -f1)/" \
            cmake/get_cpm.cmake > dist/get_cpm.cmake

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" \
            dist/*.cmake \
            --title "${{ inputs.tag }}" \
            --generate-notes
